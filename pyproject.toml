[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strixae"
version = "0.1.0"
description = "Inference utilities for the strixAE GRPO audio-reasoning model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "wujunjiehhs-max"}]
dependencies = [
  "torch>=2.1",
  "transformers==4.57.6",
  "accelerate>=1.0",
  "librosa>=0.10",
  "soundfile>=0.12",
  "safetensors>=0.4",
]

[project.urls]
Homepage = "https://github.com/wujunjiehhs-max/strixAE"
Model = "https://huggingface.co/wujunjiehhs/strixAE"

[project.scripts]
strixae-infer = "strixae.inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
